; PlatformIO Project Configuration File
; ESP32 Self-Balancing Robot (MPU6500 + TB6612FNG)

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Optional (remove the leading ';' if needed) ---
; If the build fails with "text section exceeds available space" (Bluetooth makes the firmware large):
; board_build.partitions = huge_app.csv
; Decode crash backtraces (Guru Meditation Error) in the Serial Monitor:
; monitor_filters = esp32_exception_decoder